---
- name: Provision Ubuntu WSL workstation
  hosts: localhost
  gather_facts: true
  become: true
  roles:
    - role: common
      tags:
        - common
    - role: microsoft_packages
      tags:
        - microsoft
    - role: anyenv
      tags:
        - anyenv
    - role: dotnet
      tags:
        - dotnet
    - role: azure_tools
      tags:
        - azure
    - role: dev_tools
      tags:
        - dev-tools
    - role: docker
      when: wsl_install_docker | bool
      tags:
        - docker
