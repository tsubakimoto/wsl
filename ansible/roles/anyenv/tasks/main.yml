---
- name: Install anyenv build dependencies
  ansible.builtin.apt:
    name:
      - autoconf
      - bison
      - build-essential
      - libbz2-dev
      - libcurl4-openssl-dev
      - libffi-dev
      - libgl1-mesa-dev
      - libjpeg-dev
      - liblzma-dev
      - libonig-dev
      - libpng-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libtidy-dev
      - libxml2-dev
      - libxslt1-dev
      - libzip-dev
      - pkg-config
      - python3-tk
      - re2c
      - tk-dev
      - zlib1g-dev
    state: present

- name: Install anyenv
  ansible.builtin.git:
    repo: https://github.com/anyenv/anyenv.git
    dest: "{{ wsl_anyenv_root }}"
    version: master
    update: true
  become: false

- name: Ensure anyenv plugins directory exists
  ansible.builtin.file:
    path: "{{ wsl_anyenv_plugins_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install anyenv install plugin
  ansible.builtin.git:
    repo: https://github.com/anyenv/anyenv-install.git
    dest: "{{ wsl_anyenv_plugins_dir }}/anyenv-install"
    version: master
    update: true
  become: false

- name: Install anyenv update plugin
  ansible.builtin.git:
    repo: https://github.com/znz/anyenv-update.git
    dest: "{{ wsl_anyenv_plugins_dir }}/anyenv-update"
    version: master
    update: true
  become: false

- name: Configure anyenv in bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE anyenv"
    block: |
      export PATH="{{ wsl_anyenv_root }}/bin:$PATH"
      eval "$({{ wsl_anyenv_root }}/bin/anyenv init -)"
    create: true
    mode: "0644"
  become: false

- name: Install anyenv managed environments
  ansible.builtin.command:
    argv:
      - "{{ wsl_anyenv_root }}/bin/anyenv"
      - install
      - "{{ item }}"
  args:
    creates: "{{ wsl_anyenv_root }}/envs/{{ item }}"
  environment:
    ANYENV_ROOT: "{{ wsl_anyenv_root }}"
    PATH: "{{ wsl_anyenv_root }}/bin:{{ wsl_anyenv_root }}/shims:{{ ansible_env.PATH }}"
  loop: "{{ wsl_anyenv_envs }}"
  become: false

- name: Install nodenv package rehash plugin
  ansible.builtin.git:
    repo: https://github.com/nodenv/nodenv-package-rehash.git
    dest: "{{ wsl_anyenv_root }}/envs/nodenv/plugins/nodenv-package-rehash"
    version: master
    update: true
  become: false
  when: "'nodenv' in wsl_anyenv_envs"

- name: Refresh nodenv package hooks
  ansible.builtin.shell: |
    eval "$({{ wsl_anyenv_root }}/bin/anyenv init -)"
    nodenv hooks install
    nodenv package-hooks install --all
  args:
    executable: /bin/bash
  environment:
    ANYENV_ROOT: "{{ wsl_anyenv_root }}"
    PATH: "{{ wsl_anyenv_root }}/bin:{{ wsl_anyenv_root }}/shims:{{ wsl_anyenv_root }}/envs/nodenv/bin:{{ wsl_anyenv_root }}/envs/nodenv/shims:{{ ansible_env.PATH }}"
  changed_when: false
  become: false
  when: "'nodenv' in wsl_anyenv_envs"
